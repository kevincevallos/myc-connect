<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MYC Connect</title>
<style>
:root{--blue:#2B557E;--brown:#815747;--cream:#F3EADD;--green:#0E4F43;--red:#C62700;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--bg:#f7f8fa}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid var(--border);padding:26px 18px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;color:var(--blue);font-size:22px;margin-bottom:4px}.subtitle{color:var(--muted);font-size:12px;margin-bottom:30px}
nav a{display:block;text-decoration:none;color:var(--text);padding:11px 12px;border-radius:9px;margin:4px 0;cursor:pointer}
nav a.active,nav a:hover{background:var(--cream);color:var(--blue);font-weight:700}
main{padding:28px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
h1{margin:0;font-size:28px}h2{margin:0 0 14px}.top small,.muted{color:var(--muted)}
button{border:0;border-radius:9px;padding:11px 15px;cursor:pointer;font-weight:700}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid var(--border);color:var(--text)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px;margin-bottom:22px}.card,.panel{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px}
.card .label{color:var(--muted);font-size:13px}.card .value{font-size:30px;font-weight:800;margin-top:8px;color:var(--blue)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--border);font-size:14px}th{color:var(--muted);font-size:12px;text-transform:uppercase}
tr.clickable{cursor:pointer}tr.clickable:hover{background:#fafafa}
.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:var(--cream);color:var(--brown);font-size:12px;font-weight:700}
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;margin-bottom:16px}.filters input,.filters select,.grid input,.grid select,.grid textarea{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:8px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--muted)}textarea{min-height:90px;resize:vertical}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.modal-box{background:#fff;width:min(820px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:22px}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.notice{margin:12px 0 0;font-size:13px}
.profile-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.profile-title{font-size:30px;font-weight:800}.profile-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.stack{display:grid;gap:16px}.kv{display:grid;grid-template-columns:150px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{padding:6px 9px;border-radius:999px;background:#eef3f7;color:var(--blue);font-size:12px}
.empty{padding:24px;text-align:center;color:var(--muted)}.link{color:var(--blue);text-decoration:none}.back{margin-bottom:15px;display:inline-block;color:var(--blue);cursor:pointer;font-weight:700}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.profile-grid{grid-template-columns:1fr}}
@media(max-width:760px){.layout{grid-template-columns:1fr}aside{display:none}.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.full{grid-column:auto}}
</style>

<style id="pipeline-extra">
.pipeline-board{display:grid;grid-template-columns:repeat(8,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.pipeline-col{background:#f3f5f7;border:1px solid var(--border);border-radius:14px;padding:12px;min-height:360px}
.pipeline-col h3{font-size:14px;margin:0 0 10px;color:var(--blue)}
.opp-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.opp-card strong{display:block;margin-bottom:5px}
.opp-card .org{font-size:12px;color:var(--muted);margin-bottom:8px}
.opp-card select{width:100%;padding:7px;border:1px solid var(--border);border-radius:8px}
</style>

</head>
<body>
<div class="layout">
<aside>
  <div class="brand">MYC Connect</div>
  <div class="subtitle">Business Matching CRM</div>
  <nav>
    <a data-route="dashboard">Dashboard</a>
    <a data-route="organizations">Organizaciones</a>
    <a data-route="contacts">Contactos</a>
    <a data-route="pipeline">Pipeline</a>
    <a>Matches</a>
    <a>Seguimientos</a>
  </nav>
</aside>
<main id="app"></main>
</div>

<div class="modal" id="organizationModal">
  <div class="modal-box">
    <h2 id="modalTitle">Registrar organización</h2>
    <form id="organizationForm">
      <input type="hidden" name="id" />
      <div class="grid">
        <div><label>Nombre *</label><input name="name" required /></div>
        <div><label>Tipo de organización *</label>
          <select name="organizationType" required>
            <option value="Company">Empresa</option><option value="Institution">Institución</option>
            <option value="University">Universidad</option><option value="NGO">ONG</option>
            <option value="Association">Asociación</option><option value="Public body">Entidad pública</option>
          </select>
        </div>
        <div><label>País *</label><input name="country" value="Ecuador" required /></div>
        <div><label>Ciudad / Región</label><input name="cityRegion" /></div>
        <div><label>Dirección *</label>
          <select name="direction" required>
            <option value="ECUADOR_TO_EUROPE">Ecuador → Europa</option>
            <option value="EUROPE_TO_ECUADOR">Europa → Ecuador</option>
            <option value="SCIENCE_INNOVATION">Science & Innovation</option>
          </select>
        </div>
        <div><label>Sector *</label><input name="sector" required /></div>
        <div><label>Subsector</label><input name="subsector" /></div>
        <div><label>Potencial estratégico</label>
          <select name="strategicPotential">
            <option value="">Sin definir</option><option value="HIGH">Alto</option>
            <option value="MEDIUM">Medio</option><option value="LOW">Bajo</option>
          </select>
        </div>
        <div><label>Fuente del lead</label><input name="leadSource" /></div>
        <div><label>Estado comercial</label>
          <select name="pipelineStage">
            <option value="IDENTIFIED">Identified</option><option value="CONTACTED">Contacted</option>
            <option value="RESPONDED">Responded</option><option value="MEETING">Meeting</option>
            <option value="QUALIFIED_OPPORTUNITY">Qualified Opportunity</option><option value="PROPOSAL">Proposal</option>
            <option value="NEGOTIATION">Negotiation</option><option value="CLIENT">Client</option>
            <option value="CLOSED">Closed</option><option value="NOT_INTERESTED">Not interested</option>
            <option value="NOT_QUALIFIED">Not qualified</option><option value="ON_HOLD">On hold</option>
          </select>
        </div>
        <div class="full"><label>Qué ofrece</label><textarea name="offerSummary"></textarea></div>
        <div class="full"><label>Necesidades (separadas por coma)</label><input name="needs" /></div>
        <div class="full"><label>Mercados actuales (separados por coma)</label><input name="currentMarkets" /></div>
        <div class="full"><label>Mercados objetivo (separados por coma)</label><input name="targetMarkets" /></div>
        <div><label>Sitio web</label><input name="website" /></div>
        <div><label>LinkedIn</label><input name="linkedin" /></div>
        <div><label>Instagram</label><input name="instagram" /></div>
        <div><label>Próxima acción</label><input name="nextAction" /></div>
        <div><label>Fecha próxima acción</label><input type="date" name="nextActionDate" /></div>
      </div>
      <div id="formNotice" class="notice"></div>
      <div class="actions">
        <button type="button" class="secondary" id="closeModal">Cancelar</button>
        <button type="submit" class="primary">Guardar</button>
      </div>
    </form>
  </div>
</div>


<div class="modal" id="contactModal">
  <div class="modal-box">
    <h2 id="contactModalTitle">Registrar contacto</h2>
    <form id="contactForm">
      <input type="hidden" name="id" />
      <input type="hidden" name="organizationId" />
      <div class="grid">
        <div><label>Nombre *</label><input name="firstName" required /></div>
        <div><label>Apellido *</label><input name="lastName" required /></div>
        <div><label>Cargo / rol</label><input name="jobTitle" /></div>
        <div><label>Email</label><input type="email" name="email" /></div>
        <div><label>Teléfono / WhatsApp</label><input name="phoneWhatsapp" /></div>
        <div><label>LinkedIn</label><input name="linkedin" /></div>
        <div><label>Idioma preferido</label>
          <select name="preferredLanguage">
            <option value="">Sin definir</option>
            <option value="Español">Español</option>
            <option value="English">English</option>
            <option value="Deutsch">Deutsch</option>
            <option value="Français">Français</option>
            <option value="Italiano">Italiano</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
        <div>
          <label>Contacto principal</label>
          <select name="isPrimary">
            <option value="false">No</option>
            <option value="true">Sí</option>
          </select>
        </div>
        <div class="full"><label>Notas</label><textarea name="notes"></textarea></div>
      </div>
      <div id="contactNotice" class="notice"></div>
      <div class="actions">
        <button type="button" class="secondary" id="closeContactModal">Cancelar</button>
        <button type="submit" class="primary">Guardar contacto</button>
      </div>
    </form>
  </div>
</div>


<div class="modal" id="interactionModal">
  <div class="modal-box">
    <h2 id="interactionModalTitle">Registrar interacción</h2>
    <form id="interactionForm">
      <input type="hidden" name="id" />
      <input type="hidden" name="organizationId" />
      <div class="grid">
        <div><label>Fecha y hora</label><input type="datetime-local" name="date" /></div>
        <div><label>Tipo *</label><select name="type" required>
          <option value="EMAIL">Email</option><option value="CALL">Llamada</option>
          <option value="LINKEDIN">LinkedIn</option><option value="INSTAGRAM">Instagram</option>
          <option value="WHATSAPP">WhatsApp</option><option value="MEETING">Reunión</option>
          <option value="EVENT">Evento</option><option value="OTHER">Otro</option>
        </select></div>
        <div class="full"><label>Nota / resultado *</label><textarea name="note" required placeholder="¿Qué ocurrió? ¿Qué se acordó?"></textarea></div>
        <div><label>Responsable</label><input name="responsible" placeholder="Ej. Evelyn / Kevin" /></div>
        <div><label>Adjunto o enlace</label><input name="attachmentUrl" placeholder="https://..." /></div>
        <div><label>Próxima acción</label><input name="nextAction" placeholder="Ej. Enviar presentación comercial" /></div>
        <div><label>Fecha límite / seguimiento</label><input type="date" name="deadline" /></div>
      </div>
      <div id="interactionNotice" class="notice"></div>
      <div class="actions">
        <button type="button" class="secondary" id="closeInteractionModal">Cancelar</button>
        <button type="submit" class="primary">Guardar interacción</button>
      </div>
    </form>
  </div>
</div>


<div class="modal" id="opportunityModal">
  <div class="modal-box">
    <h2 id="opportunityModalTitle">Nueva oportunidad</h2>
    <form id="opportunityForm">
      <input type="hidden" name="id" />
      <input type="hidden" name="organizationId" />
      <div class="grid">
        <div class="full">
          <label>Título *</label>
          <input name="title" required placeholder="Ej. Introducción comercial con compradores en Alemania" />
        </div>
        <div class="full">
          <label>Descripción</label>
          <textarea name="description"></textarea>
        </div>
        <div>
          <label>Etapa *</label>
          <select name="stage" required>
            <option value="IDENTIFIED">Identified</option>
            <option value="CONTACTED">Contacted</option>
            <option value="RESPONDED">Responded</option>
            <option value="MEETING">Meeting</option>
            <option value="QUALIFIED_OPPORTUNITY">Qualified Opportunity</option>
            <option value="PROPOSAL">Proposal</option>
            <option value="NEGOTIATION">Negotiation</option>
            <option value="CLIENT">Client</option>
            <option value="CLOSED">Closed</option>
            <option value="NOT_INTERESTED">Not interested</option>
            <option value="NOT_QUALIFIED">Not qualified</option>
            <option value="ON_HOLD">On hold</option>
          </select>
        </div>
        <div>
          <label>Fecha próxima acción</label>
          <input type="date" name="nextActionDate" />
        </div>
        <div class="full">
          <label>Próxima acción</label>
          <input name="nextAction" placeholder="Ej. Enviar propuesta comercial" />
        </div>
      </div>
      <div id="opportunityNotice" class="notice"></div>
      <div class="actions">
        <button type="button" class="secondary" id="closeOpportunityModal">Cancelar</button>
        <button type="submit" class="primary">Guardar oportunidad</button>
      </div>
    </form>
  </div>
</div>

<script>
const app = document.getElementById("app");
const modal = document.getElementById("organizationModal");
const form = document.getElementById("organizationForm");
const notice = document.getElementById("formNotice");

const labels = {
  ECUADOR_TO_EUROPE:"Ecuador → Europa", EUROPE_TO_ECUADOR:"Europa → Ecuador", SCIENCE_INNOVATION:"Science & Innovation",
  HIGH:"Alto", MEDIUM:"Medio", LOW:"Bajo"
};

function esc(v){return String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}
function fmtDate(v){ if(!v) return "—"; return new Date(v).toLocaleDateString("es-EC"); }
function setActive(route){
  document.querySelectorAll("nav a[data-route]").forEach(a=>a.classList.toggle("active",a.dataset.route===route));
}
function goto(route){ location.hash = route; }
document.querySelectorAll("nav a[data-route]").forEach(a=>a.onclick=()=>goto(a.dataset.route));

function parseCsv(v){ return String(v||"").split(",").map(x=>x.trim()).filter(Boolean); }
function dateInput(v){ return v ? new Date(v).toISOString().slice(0,10) : ""; }

function openCreate(){
  form.reset(); form.elements.id.value=""; form.elements.country.value="Ecuador";
  document.getElementById("modalTitle").textContent="Registrar organización";
  notice.textContent=""; modal.classList.add("open");
}
function openEdit(o){
  form.reset();
  document.getElementById("modalTitle").textContent="Editar organización";
  const set=(n,v)=>{ if(form.elements[n]) form.elements[n].value=v ?? ""; };
  set("id",o.id); set("name",o.name); set("organizationType",o.organizationType); set("country",o.country);
  set("cityRegion",o.cityRegion); set("website",o.website); set("linkedin",o.linkedin); set("instagram",o.instagram);
  set("direction",o.direction); set("sector",o.sector); set("subsector",o.subsector); set("offerSummary",o.offerSummary);
  set("needs",(o.needs||[]).join(", ")); set("currentMarkets",(o.currentMarkets||[]).join(", "));
  set("targetMarkets",(o.targetMarkets||[]).join(", ")); set("strategicPotential",o.strategicPotential);
  set("leadSource",o.leadSource); set("pipelineStage",o.pipelineStage); set("nextAction",o.nextAction);
  set("nextActionDate",dateInput(o.nextActionDate)); notice.textContent=""; modal.classList.add("open");
}
document.getElementById("closeModal").onclick=()=>modal.classList.remove("open");

form.addEventListener("submit",async e=>{
  e.preventDefault(); const fd=new FormData(form); const data=Object.fromEntries(fd.entries()); const id=data.id; delete data.id;
  data.needs=parseCsv(data.needs); data.currentMarkets=parseCsv(data.currentMarkets); data.targetMarkets=parseCsv(data.targetMarkets);
  notice.textContent="Guardando...";
  const res=await fetch(id?`/api/organizations/${id}`:"/api/organizations",{
    method:id?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)
  });
  const out=await res.json();
  if(!res.ok){ notice.textContent=out.error||"Ocurrió un error."; return; }
  notice.textContent=id?"Organización actualizada.":"Organización registrada.";
  setTimeout(()=>{modal.classList.remove("open"); route();},350);
});


const contactModal = document.getElementById("contactModal");
const contactForm = document.getElementById("contactForm");
const contactNotice = document.getElementById("contactNotice");

function openContactCreate(organizationId){
  contactForm.reset();
  contactForm.elements.id.value = "";
  contactForm.elements.organizationId.value = organizationId;
  document.getElementById("contactModalTitle").textContent = "Registrar contacto";
  contactNotice.textContent = "";
  contactModal.classList.add("open");
}

function openContactEdit(c){
  contactForm.reset();
  document.getElementById("contactModalTitle").textContent = "Editar contacto";
  contactForm.elements.id.value = c.id;
  contactForm.elements.organizationId.value = c.organizationId;
  contactForm.elements.firstName.value = c.firstName || "";
  contactForm.elements.lastName.value = c.lastName || "";
  contactForm.elements.jobTitle.value = c.jobTitle || "";
  contactForm.elements.email.value = c.email || "";
  contactForm.elements.phoneWhatsapp.value = c.phoneWhatsapp || "";
  contactForm.elements.linkedin.value = c.linkedin || "";
  contactForm.elements.preferredLanguage.value = c.preferredLanguage || "";
  contactForm.elements.isPrimary.value = c.isPrimary ? "true" : "false";
  contactForm.elements.notes.value = c.notes || "";
  contactNotice.textContent = "";
  contactModal.classList.add("open");
}

document.getElementById("closeContactModal").onclick = () => contactModal.classList.remove("open");

contactForm.addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData(contactForm);
  const data = Object.fromEntries(fd.entries());
  const id = data.id;
  const organizationId = data.organizationId;
  delete data.id;
  delete data.organizationId;
  data.isPrimary = data.isPrimary === "true";

  contactNotice.textContent = "Guardando...";

  const res = await fetch(
    id ? `/api/contacts/${id}` : `/api/organizations/${organizationId}/contacts`,
    {
      method: id ? "PUT" : "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    }
  );

  const out = await res.json();
  if (!res.ok) {
    contactNotice.textContent = out.error || "Ocurrió un error.";
    return;
  }

  contactNotice.textContent = id ? "Contacto actualizado." : "Contacto registrado.";
  setTimeout(() => {
    contactModal.classList.remove("open");
    route();
  }, 300);
});

async function deleteContact(id){
  if (!confirm("¿Eliminar este contacto?")) return;
  const res = await fetch(`/api/contacts/${id}`, { method: "DELETE" });
  const out = await res.json();
  if (!res.ok) return alert(out.error || "No se pudo eliminar.");
  route();
}

async function contactsPage(){
  setActive("contacts");
  app.innerHTML = `
    <div class="top">
      <div><h1>Contactos</h1><small>Personas vinculadas a organizaciones</small></div>
    </div>
    <section class="panel">
      <table>
        <thead>
          <tr>
            <th>Contacto</th>
            <th>Organización</th>
            <th>Cargo</th>
            <th>Email / WhatsApp</th>
            <th>Idioma</th>
            <th>Principal</th>
          </tr>
        </thead>
        <tbody id="contactRows"><tr><td colspan="6">Cargando...</td></tr></tbody>
      </table>
    </section>`;

  const res = await fetch("/api/contacts");
  const items = await res.json();
  const tbody = document.getElementById("contactRows");

  tbody.innerHTML = items.length ? items.map(c => `
    <tr class="clickable" onclick="goto('organization/${c.organizationId}')">
      <td><strong>${esc(c.firstName + " " + c.lastName)}</strong></td>
      <td>${esc(c.organization?.name || "—")}</td>
      <td>${esc(c.jobTitle || "—")}</td>
      <td>${esc(c.email || c.phoneWhatsapp || "—")}</td>
      <td>${esc(c.preferredLanguage || "—")}</td>
      <td>${c.isPrimary ? '<span class="pill">Sí</span>' : 'No'}</td>
    </tr>
  `).join("") : `<tr><td colspan="6" class="empty">Todavía no hay contactos registrados.</td></tr>`;
}



const interactionModal = document.getElementById("interactionModal");
const interactionForm = document.getElementById("interactionForm");
const interactionNotice = document.getElementById("interactionNotice");
const interactionLabels = { EMAIL:"Email", CALL:"Llamada", LINKEDIN:"LinkedIn", INSTAGRAM:"Instagram", WHATSAPP:"WhatsApp", MEETING:"Reunión", EVENT:"Evento", OTHER:"Otro" };

function toLocalDateTimeInput(v){
  const d = v ? new Date(v) : new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}

function openInteractionCreate(organizationId){
  interactionForm.reset();
  interactionForm.elements.id.value = "";
  interactionForm.elements.organizationId.value = organizationId;
  interactionForm.elements.date.value = toLocalDateTimeInput();
  document.getElementById("interactionModalTitle").textContent = "Registrar interacción";
  interactionNotice.textContent = "";
  interactionModal.classList.add("open");
}

function openInteractionEdit(i){
  interactionForm.reset();
  document.getElementById("interactionModalTitle").textContent = "Editar interacción";
  interactionForm.elements.id.value = i.id;
  interactionForm.elements.organizationId.value = i.organizationId;
  interactionForm.elements.date.value = toLocalDateTimeInput(i.date);
  interactionForm.elements.type.value = i.type || "OTHER";
  interactionForm.elements.note.value = i.note || "";
  interactionForm.elements.responsible.value = i.responsible || "";
  interactionForm.elements.attachmentUrl.value = i.attachmentUrl || "";
  interactionForm.elements.nextAction.value = i.nextAction || "";
  interactionForm.elements.deadline.value = i.deadline ? new Date(i.deadline).toISOString().slice(0,10) : "";
  interactionNotice.textContent = "";
  interactionModal.classList.add("open");
}

document.getElementById("closeInteractionModal").onclick = () => interactionModal.classList.remove("open");

interactionForm.addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData(interactionForm);
  const data = Object.fromEntries(fd.entries());
  const id = data.id;
  const organizationId = data.organizationId;
  delete data.id; delete data.organizationId;
  interactionNotice.textContent = "Guardando...";

  const res = await fetch(id ? `/api/interactions/${id}` : `/api/organizations/${organizationId}/interactions`, {
    method: id ? "PUT" : "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });
  const out = await res.json();
  if (!res.ok) { interactionNotice.textContent = out.error || "Ocurrió un error."; return; }
  interactionNotice.textContent = id ? "Interacción actualizada." : "Interacción registrada.";
  setTimeout(() => { interactionModal.classList.remove("open"); route(); }, 300);
});

async function deleteInteraction(id){
  if (!confirm("¿Eliminar esta interacción del historial?")) return;
  const res = await fetch(`/api/interactions/${id}`, { method: "DELETE" });
  const out = await res.json();
  if (!res.ok) return alert(out.error || "No se pudo eliminar.");
  route();
}


const opportunityModal = document.getElementById("opportunityModal");
const opportunityForm = document.getElementById("opportunityForm");
const opportunityNotice = document.getElementById("opportunityNotice");

const pipelineStages = [
  "IDENTIFIED","CONTACTED","RESPONDED","MEETING",
  "QUALIFIED_OPPORTUNITY","PROPOSAL","NEGOTIATION","CLIENT"
];

const pipelineLabels = {
  IDENTIFIED:"Identified",
  CONTACTED:"Contacted",
  RESPONDED:"Responded",
  MEETING:"Meeting",
  QUALIFIED_OPPORTUNITY:"Qualified Opportunity",
  PROPOSAL:"Proposal",
  NEGOTIATION:"Negotiation",
  CLIENT:"Client",
  CLOSED:"Closed",
  NOT_INTERESTED:"Not interested",
  NOT_QUALIFIED:"Not qualified",
  ON_HOLD:"On hold"
};

function openOpportunityCreate(organizationId){
  opportunityForm.reset();
  opportunityForm.elements.id.value = "";
  opportunityForm.elements.organizationId.value = organizationId;
  document.getElementById("opportunityModalTitle").textContent = "Nueva oportunidad";
  opportunityNotice.textContent = "";
  opportunityModal.classList.add("open");
}

function openOpportunityEdit(o){
  opportunityForm.reset();
  document.getElementById("opportunityModalTitle").textContent = "Editar oportunidad";
  opportunityForm.elements.id.value = o.id;
  opportunityForm.elements.organizationId.value = o.organizationId;
  opportunityForm.elements.title.value = o.title || "";
  opportunityForm.elements.description.value = o.description || "";
  opportunityForm.elements.stage.value = o.stage || "IDENTIFIED";
  opportunityForm.elements.nextAction.value = o.nextAction || "";
  opportunityForm.elements.nextActionDate.value = o.nextActionDate ? new Date(o.nextActionDate).toISOString().slice(0,10) : "";
  opportunityNotice.textContent = "";
  opportunityModal.classList.add("open");
}

document.getElementById("closeOpportunityModal").onclick = () => opportunityModal.classList.remove("open");

opportunityForm.addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData(opportunityForm);
  const data = Object.fromEntries(fd.entries());
  const id = data.id;
  const organizationId = data.organizationId;
  delete data.id;
  delete data.organizationId;

  opportunityNotice.textContent = "Guardando...";

  const res = await fetch(
    id ? `/api/opportunities/${id}` : `/api/organizations/${organizationId}/opportunities`,
    {
      method: id ? "PUT" : "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    }
  );

  const out = await res.json();
  if (!res.ok) {
    opportunityNotice.textContent = out.error || "Ocurrió un error.";
    return;
  }

  opportunityNotice.textContent = id ? "Oportunidad actualizada." : "Oportunidad creada.";
  setTimeout(() => {
    opportunityModal.classList.remove("open");
    route();
  }, 300);
});

async function deleteOpportunity(id){
  if (!confirm("¿Eliminar esta oportunidad?")) return;
  const res = await fetch(`/api/opportunities/${id}`, { method: "DELETE" });
  const out = await res.json();
  if (!res.ok) return alert(out.error || "No se pudo eliminar.");
  route();
}

async function changeOpportunityStage(id, stage){
  const res = await fetch(`/api/opportunities/${id}/stage`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ stage })
  });
  const out = await res.json();
  if (!res.ok) {
    alert(out.error || "No se pudo cambiar la etapa.");
    return;
  }
  pipelinePage();
}

async function pipelinePage(){
  setActive("pipeline");
  app.innerHTML = `
    <div class="top">
      <div>
        <h1>Pipeline comercial</h1>
        <small>Oportunidades activas por etapa comercial</small>
      </div>
    </div>
    <div id="pipelineBoard" class="pipeline-board"></div>`;

  const res = await fetch("/api/opportunities");
  const items = await res.json();

  const board = document.getElementById("pipelineBoard");
  board.innerHTML = pipelineStages.map(stage => {
    const stageItems = items.filter(x => x.stage === stage);
    return `
      <section class="pipeline-col">
        <h3>${pipelineLabels[stage]} · ${stageItems.length}</h3>
        ${stageItems.length ? stageItems.map(o => `
          <div class="opp-card">
            <strong>${esc(o.title)}</strong>
            <div class="org">${esc(o.organization?.name || "—")}</div>
            ${o.nextAction ? `<div class="muted" style="font-size:12px;margin-bottom:8px">Próxima: ${esc(o.nextAction)}</div>` : ""}
            <select onchange="changeOpportunityStage('${o.id}', this.value)">
              ${pipelineStages.map(s => `<option value="${s}" ${s===o.stage?"selected":""}>${pipelineLabels[s]}</option>`).join("")}
            </select>
          </div>
        `).join("") : `<div class="empty">Sin oportunidades</div>`}
      </section>`;
  }).join("");
}


async function dashboard(){
  setActive("dashboard");
  app.innerHTML=`<div class="top"><div><h1>Dashboard</h1><small>Resumen comercial de Mishki Yaku Collective</small></div><button class="primary" onclick="openCreate()">+ Registrar organización</button></div>
  <section class="cards">
    ${["totalOrganizations","newLeadsThisMonth","activeOpportunities","openMatches","ecuadorToEurope","europeToEcuador","followUpsDue"].map(k=>`<div class="card"><div class="label">${({totalOrganizations:"Total organizaciones",newLeadsThisMonth:"Nuevos leads este mes",activeOpportunities:"Oportunidades activas",openMatches:"Matches abiertos",ecuadorToEurope:"Ecuador → Europa",europeToEcuador:"Europa → Ecuador",followUpsDue:"Follow-ups vencidos"})[k]}</div><div class="value" id="${k}">0</div></div>`).join("")}
  </section>
  <section class="panel"><h2>Organizaciones recientes</h2><table><thead><tr><th>Organización</th><th>País</th><th>Sector</th><th>Dirección</th><th>Pipeline</th></tr></thead><tbody id="recent"><tr><td colspan="5">Cargando...</td></tr></tbody></table></section>`;
  const [dres,ores]=await Promise.all([fetch("/api/dashboard"),fetch("/api/organizations")]);
  const d=await dres.json(), orgs=await ores.json();
  Object.entries(d).forEach(([k,v])=>{const el=document.getElementById(k);if(el)el.textContent=v});
  const tbody=document.getElementById("recent");
  tbody.innerHTML=orgs.length?orgs.slice(0,8).map(o=>row(o)).join(""):`<tr><td colspan="5">Todavía no hay organizaciones registradas.</td></tr>`;
}

function row(o){
  return `<tr class="clickable" onclick="goto('organization/${o.id}')"><td><strong>${esc(o.name)}</strong></td><td>${esc(o.country)}</td><td>${esc(o.sector)}</td><td>${esc(labels[o.direction]||o.direction)}</td><td><span class="pill">${esc(o.pipelineStage.replaceAll("_"," "))}</span></td></tr>`;
}

async function organizations(){
  setActive("organizations");
  app.innerHTML=`<div class="top"><div><h1>Organizaciones</h1><small>Empresas, instituciones y prospectos Ecuador ↔ Europa</small></div><button class="primary" onclick="openCreate()">+ Registrar organización</button></div>
  <section class="panel">
    <div class="filters">
      <input id="q" placeholder="Buscar nombre, país, ciudad, sector..." />
      <select id="direction"><option value="">Todas las direcciones</option><option value="ECUADOR_TO_EUROPE">Ecuador → Europa</option><option value="EUROPE_TO_ECUADOR">Europa → Ecuador</option><option value="SCIENCE_INNOVATION">Science & Innovation</option></select>
      <select id="potential"><option value="">Todo potencial</option><option value="HIGH">Alto</option><option value="MEDIUM">Medio</option><option value="LOW">Bajo</option></select>
      <select id="stage"><option value="">Todo pipeline</option>${["IDENTIFIED","CONTACTED","RESPONDED","MEETING","QUALIFIED_OPPORTUNITY","PROPOSAL","NEGOTIATION","CLIENT","CLOSED","ON_HOLD"].map(x=>`<option value="${x}">${x.replaceAll("_"," ")}</option>`).join("")}</select>
      <button class="secondary" id="clear">Limpiar</button>
    </div>
    <div id="resultCount" class="muted" style="margin-bottom:10px"></div>
    <table><thead><tr><th>Organización</th><th>País</th><th>Sector</th><th>Dirección</th><th>Potencial</th><th>Pipeline</th></tr></thead><tbody id="orgRows"><tr><td colspan="6">Cargando...</td></tr></tbody></table>
  </section>`;
  const q=document.getElementById("q"),direction=document.getElementById("direction"),potential=document.getElementById("potential"),stage=document.getElementById("stage");
  let timer;
  async function load(){
    const p=new URLSearchParams();
    if(q.value)p.set("q",q.value); if(direction.value)p.set("direction",direction.value); if(potential.value)p.set("strategicPotential",potential.value); if(stage.value)p.set("pipelineStage",stage.value);
    const res=await fetch("/api/organizations?"+p.toString()); const items=await res.json();
    document.getElementById("resultCount").textContent=`${items.length} organización(es)`;
    document.getElementById("orgRows").innerHTML=items.length?items.map(o=>`<tr class="clickable" onclick="goto('organization/${o.id}')"><td><strong>${esc(o.name)}</strong></td><td>${esc(o.country)}</td><td>${esc(o.sector)}</td><td>${esc(labels[o.direction]||o.direction)}</td><td>${esc(labels[o.strategicPotential]||"—")}</td><td><span class="pill">${esc(o.pipelineStage.replaceAll("_"," "))}</span></td></tr>`).join(""):`<tr><td colspan="6" class="empty">No hay resultados con estos filtros.</td></tr>`;
  }
  q.oninput=()=>{clearTimeout(timer);timer=setTimeout(load,250)}; [direction,potential,stage].forEach(x=>x.onchange=load);
  document.getElementById("clear").onclick=()=>{q.value="";direction.value="";potential.value="";stage.value="";load()}; load();
}

function section(title, body){return `<section class="panel"><h2>${title}</h2>${body}</section>`}

async function organizationProfile(id){
  setActive("organizations");
  const res=await fetch(`/api/organizations/${id}`); const o=await res.json();
  if(!res.ok){app.innerHTML=`<div class="panel">${esc(o.error||"No se pudo cargar.")}</div>`;return}
  const contacts=o.contacts||[], interactions=o.interactions||[], opps=o.opportunities||[], tasks=o.tasks||[];
  const matches=[...(o.matchesAsA||[]).map(m=>({m,other:m.organizationB})),...(o.matchesAsB||[]).map(m=>({m,other:m.organizationA}))];
  app.innerHTML=`
  <span class="back" onclick="goto('organizations')">← Volver a organizaciones</span>
  <div class="profile-head">
    <div><div class="profile-title">${esc(o.name)}</div><div class="muted">${esc(o.organizationType)} · ${esc(o.country)}${o.cityRegion?" · "+esc(o.cityRegion):""}</div></div>
    <button class="primary" id="editBtn">Editar organización</button>
  </div>
  <div class="profile-grid">
    <div class="stack">
      ${section("Información comercial",`
        <div class="kv"><strong>Dirección</strong><span>${esc(labels[o.direction]||o.direction)}</span></div>
        <div class="kv"><strong>Sector</strong><span>${esc(o.sector)}${o.subsector?" / "+esc(o.subsector):""}</span></div>
        <div class="kv"><strong>Potencial</strong><span>${esc(labels[o.strategicPotential]||"Sin definir")}</span></div>
        <div class="kv"><strong>Pipeline</strong><span class="pill">${esc(o.pipelineStage.replaceAll("_"," "))}</span></div>
        <div class="kv"><strong>Fuente lead</strong><span>${esc(o.leadSource||"—")}</span></div>
        <div class="kv"><strong>Última interacción</strong><span>${fmtDate(o.lastInteractionAt)}</span></div>
      `)}
      ${section("Qué ofrece",`<p>${esc(o.offerSummary||"Sin información registrada.")}</p>`)}
      ${section("Qué necesita",o.needs?.length?`<div class="tags">${o.needs.map(n=>`<span class="tag">${esc(n)}</span>`).join("")}</div>`:`<div class="empty">Sin necesidades registradas.</div>`)}
      ${section("Mercados",`
        <div class="kv"><strong>Actuales</strong><span>${esc((o.currentMarkets||[]).join(", ")||"—")}</span></div>
        <div class="kv"><strong>Objetivo</strong><span>${esc((o.targetMarkets||[]).join(", ")||"—")}</span></div>
      `)}
      ${section("Contactos",`
        <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
          <button class="primary" onclick="openContactCreate('${o.id}')">+ Añadir contacto</button>
        </div>
        ${contacts.length ? contacts.map(c=>`
          <div class="kv">
            <strong>${esc(c.firstName+" "+c.lastName)}${c.isPrimary?' · Principal':''}</strong>
            <span>
              ${esc(c.jobTitle||"—")}<br>
              <span class="muted">${esc(c.email||"")}${c.email&&c.phoneWhatsapp?" · ":""}${esc(c.phoneWhatsapp||"")}</span><br>
              <span class="muted">${esc(c.preferredLanguage||"")}</span><br>
              <button class="secondary" style="margin-top:7px;padding:7px 10px" onclick='openContactEdit(${JSON.stringify(c)})'>Editar</button>
              <button class="secondary" style="margin-top:7px;padding:7px 10px" onclick="deleteContact('${c.id}')">Eliminar</button>
            </span>
          </div>`).join("") : `<div class="empty">Todavía no hay contactos.</div>`}
      `)}
      ${section("Historial de interacciones",`
        <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
          <button class="primary" onclick="openInteractionCreate('${o.id}')">+ Añadir interacción</button>
        </div>
        ${interactions.length ? interactions.map(i=>`
          <div class="kv">
            <strong>${fmtDate(i.date)} · ${esc(interactionLabels[i.type] || i.type)}</strong>
            <span>
              ${esc(i.note)}
              ${i.responsible ? `<br><span class="muted">Responsable: ${esc(i.responsible)}</span>` : ""}
              ${i.nextAction ? `<br><span class="muted">Próxima acción: ${esc(i.nextAction)}${i.deadline ? " · " + fmtDate(i.deadline) : ""}</span>` : ""}
              ${i.attachmentUrl ? `<br><a class="link" target="_blank" href="${esc(i.attachmentUrl)}">Abrir enlace ↗</a>` : ""}
              <br>
              <button class="secondary" style="margin-top:7px;padding:7px 10px" onclick='openInteractionEdit(${JSON.stringify(i)})'>Editar</button>
              <button class="secondary" style="margin-top:7px;padding:7px 10px" onclick="deleteInteraction('${i.id}')">Eliminar</button>
            </span>
          </div>`).join("") : `<div class="empty">Todavía no hay interacciones.</div>`}

    </div>
    <div class="stack">
      ${section("Próxima acción",`<p><strong>${esc(o.nextAction||"Sin próxima acción")}</strong></p><div class="muted">${fmtDate(o.nextActionDate)}</div>`)}

        <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
          <button class="primary" onclick="openOpportunityCreate('${o.id}')">+ Añadir oportunidad</button>
        </div>
        ${opps.length ? opps.map(x=>`
          <div class="kv">
            <strong>${esc(x.title)}</strong>
            <span>
              <span class="pill">${esc(pipelineLabels[x.stage] || x.stage)}</span>
              ${x.description ? `<br><span class="muted">${esc(x.description)}</span>` : ""}
              ${x.nextAction ? `<br><span class="muted">Próxima acción: ${esc(x.nextAction)}${x.nextActionDate ? " · " + fmtDate(x.nextActionDate) : ""}</span>` : ""}
              <br>
              <button class="secondary" style="margin-top:7px;padding:7px 10px" onclick='openOpportunityEdit(${JSON.stringify(x)})'>Editar</button>
              <button class="secondary" style="margin-top:7px;padding:7px 10px" onclick="deleteOpportunity('${x.id}')">Eliminar</button>
            </span>
          </div>`).join("") : `<div class="empty">Sin oportunidades.</div>`}
      `)}
      ${section("Matches",matches.length?matches.map(x=>`<div class="kv"><strong>${esc(x.other.name)}</strong><span>${esc(x.m.status.replaceAll("_"," "))}</span></div>`).join(""):`<div class="empty">Sin matches.</div>`)}
      ${section("Seguimientos",tasks.length?tasks.map(t=>`<div class="kv"><strong>${esc(t.title)}</strong><span>${fmtDate(t.dueDate)}${t.completed?" · Completado":""}</span></div>`).join(""):`<div class="empty">Sin seguimientos.</div>`)}
    </div>
  </div>`;
  document.getElementById("editBtn").onclick=()=>openEdit(o);
}

async function route(){
  const h=(location.hash||"#dashboard").slice(1);
  if(h==="dashboard") return dashboard();
  if(h==="organizations") return organizations();
  if(h==="contacts") return contactsPage();
  if(h==="pipeline") return pipelinePage();
  if(h.startsWith("organization/")) return organizationProfile(h.split("/")[1]);
  return dashboard();
}
window.addEventListener("hashchange",route);
route();
</script>
